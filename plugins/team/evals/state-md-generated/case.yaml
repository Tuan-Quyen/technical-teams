schema_version: "1.1"
name: state-md-generated
description: Writing .team/items/<slug>.json makes the post-write hook regenerate .team/STATE.md.
tags: [smoke, hook]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the Write tool to create `.team/items/cart-tax.json` with exactly this content, then stop:

    {"v":1,"slug":"cart-tax","key":"CART","title":"Add VAT to cart total","pipeline":"feature","tier":"T1","step":"ba","status":"running","next":"ba writes the spec","round":0,"findings":[]}
  max_turns: 4
  allowed_tools: [Write]
runs: 1
graders:
  - type: tool_used
    name: writes-item
    tool: Write
    input_match: 'items[\\/]+cart-tax\.json'
  - type: regex
    name: state-md-has-item
    target: { source: file, path: .team/STATE.md }
    pattern: '\[CART\] \[TAX\]'
