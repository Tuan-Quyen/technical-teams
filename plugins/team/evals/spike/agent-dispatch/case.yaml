schema_version: "1.1"
name: spike-agent-dispatch
description: Spike - can the session spawn a plugin agent in a headless eval run?
tags: [spike]
runs: 1
execution:
  max_turns: 8
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Agent]
  prompt: "Use the technical-team:team-architect agent to answer in one sentence: what does a monorepo trade off? Do not do it yourself."
graders:
  - name: architect-spawned
    type: tool_used
    tool: Agent
    input_match: 'team-architect'
