schema_version: "1.1"
name: spike-workflow-tool
description: Spike - is the Workflow tool present in a headless eval run?
tags: [spike]
runs: 1
execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Workflow, ToolSearch]
  prompt: "Check whether you can call a tool named exactly Workflow (use ToolSearch with query 'select:Workflow' if it is deferred). Reply with exactly one token: WORKFLOW_PRESENT or WORKFLOW_ABSENT, then one line listing your callable tool names."
graders:
  - name: workflow-present
    type: regex
    pattern: "WORKFLOW_PRESENT"
