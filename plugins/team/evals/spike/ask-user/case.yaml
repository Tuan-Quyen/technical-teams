schema_version: "1.1"
name: spike-ask-user
description: Spike - what happens to AskUserQuestion in a headless eval run?
tags: [spike]
runs: 1
execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, AskUserQuestion, ToolSearch]
  prompt: "Try to call the AskUserQuestion tool once (question: Tabs or spaces? options Tabs, Spaces; load it with ToolSearch 'select:AskUserQuestion' if deferred). Then reply with exactly one token first: ASK_ANSWERED, ASK_ERROR or ASK_ABSENT, followed by the literal answer or error text you got."
graders:
  - name: ask-answered
    type: regex
    pattern: "ASK_ANSWERED"
