schema_version: "1.1"
name: spike-slash-command
description: Spike - does a literal plugin slash command load in a headless eval run?
tags: [spike]
runs: 1
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/technical-team:crew"
graders:
  - name: crew-listed
    type: regex
    target: trace
    pattern: "team-qa|Quinn|vibe"
    flags: i
