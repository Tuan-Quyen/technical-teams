schema_version: "1.1"
name: l1-route-bug
description: A bug report through /run is routed to the fix pipeline and starts with the debugger, not the developer.
tags: [l1, routing]
runs: 3
expected_outcome: Lead classifies as a bug (fix pipeline) and plans the debugger first; with no code present it may stop and ask, but never spawns the developer.
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, ToolSearch]
  prompt: "/technical-team:run The login API returns HTTP 500 since yesterday's deploy. Users can't sign in."
graders:
  - name: no-developer
    type: tool_used
    tool: Agent
    input_match: "team-developer"
    min: 0
    max: 0
  - name: classified-fix-debugger-first
    type: llm
    focus: trace
    criteria: |
      PASS if the lead classifies the request as a bug and chooses the fix pipeline, with the debugger (root cause) as the first step - either by spawning team-debugger or, when no code is available, by stating that plan and asking the user for the code location.
      FAIL if it routes to a feature/new pipeline, starts with the developer, or starts fixing without a root-cause step.
