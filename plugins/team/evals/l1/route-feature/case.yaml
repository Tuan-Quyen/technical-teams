schema_version: "1.1"
name: l1-route-feature
description: A feature request through /run goes to the feature pipeline and starts with requirements (ba), not code.
tags: [l1, routing]
runs: 3
expected_outcome: Lead classifies as a feature (feature pipeline) with requirements (ba) as the first step; developer is never spawned in this run.
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, ToolSearch]
  prompt: "/technical-team:run Add CSV export to the monthly reports page."
graders:
  - name: classified-feature-ba-first
    type: llm
    focus: trace
    criteria: |
      PASS if the lead classifies the request as a feature and chooses the feature pipeline with requirements/ba as the first step - either by spawning team-ba or, when no code is available, by stating that plan and asking the user for the code location or requirement details.
      FAIL if it routes to fix/bug, starts with the developer, or skips requirements.
  - name: no-developer
    type: tool_used
    tool: Agent
    input_match: 'team-developer'
    min: 0
    max: 0
