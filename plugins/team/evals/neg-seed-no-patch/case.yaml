schema_version: "1.1"
name: neg-seed-no-patch
description: A state reachable through an existing seed file is reached with the seed — no temporary patch is ever written.
tags: [smoke, specialist, negative, data-patching]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Spawn the technical-team:team-developer agent with this brief, then relay its report verbatim:

    Show that the empty state ("No orders yet") renders when there are no orders. The project ships seed data (see README.md); use it, run renderOrders on the loaded list and report what you saw. Change no file.
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Edit, Write]
runs: 1
graders:
  - type: tool_used
    name: spawns-developer
    tool: Agent
    input_match: 'team-developer'
  - type: tool_used
    name: no-marker-edit
    tool: Edit
    input_match: 'TEAM-TEMP[-]PATCH'
    min: 0
    max: 0
  - type: tool_used
    name: no-marker-write
    tool: Write
    input_match: 'TEAM-TEMP[-]PATCH'
    min: 0
    max: 0
  - type: regex
    name: empty-state-shown
    target: last_message
    pattern: 'No orders yet'
