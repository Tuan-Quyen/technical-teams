schema_version: "1.1"
name: neg-question-no-pipeline
description: A plain question is answered directly — no team spawn, no item (orchestrator Simplicity rule).
tags: [smoke, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /technical-team:run What does cartTotal in src/cart.js compute? One or two sentences.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
runs: 1
graders:
  - type: tool_used
    name: no-spawn
    tool: Agent
    min: 0
    max: 0
  - type: file_exists
    name: no-item
    path: '.team/items/*.json'
    exists: false
  - type: regex
    name: answers
    pattern: 'price|qty|quantit|sum|total'
    flags: i
